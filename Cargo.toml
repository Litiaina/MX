[package]
name = "litiaina-mx"
version = "1.0.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[dependencies]
tokio = { version = "1.44.2", features = ["full"] }
axum = { version = "0.8.4", features = ["multipart", "ws"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = {  version = "1.0.127", features = ["preserve_order"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15.0"
uuid = { version = "1.16.0", features = ["v4"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"]}
headers = "0.4.0"
once_cell = "1.21.3"
hmac = "0.13"
base32 = "0.5.1"
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.22"
data-encoding = "2.9.0"
image = "0.25.6"
qrcode = "0.14.1"
rand = "0.10"
anyhow = "1"
argon2 = "0.5"
rust-ini = "0.21.3"
regex = "1.12.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rustls = { version = "0.23.31", features = ["ring"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
